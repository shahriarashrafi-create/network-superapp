name: Build Super App APK

on:
  workflow_dispatch:

  push:
    paths:
      - "*.zip"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. دریافت Repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      # --------------------------------------------------
      # 2. پیدا کردن ZIP پروژه
      #
      # Push:
      # همان ZIP تغییرکرده در Commit
      #
      # Manual:
      # آخرین ZIP ثبت‌شده در Git
      # --------------------------------------------------
      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          echo "Event: ${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "push" ]; then

            ZIP_FILE=$(git diff-tree \
              --no-commit-id \
              --name-only \
              --root \
              -r "$GITHUB_SHA" \
              -- "*.zip" \
              | awk 'index($0, "/") == 0 { print; exit }')

          fi

          # اگر اجرای دستی بود یا ZIP از Push پیدا نشد
          if [ -z "$ZIP_FILE" ]; then

            ZIP_FILE=$(
              git ls-files "*.zip" \
              | awk 'index($0, "/") == 0' \
              | while IFS= read -r file; do

                  TIMESTAMP=$(git log -1 --format=%ct -- "$file")

                  if [ -n "$TIMESTAMP" ]; then
                    printf "%s\t%s\n" "$TIMESTAMP" "$file"
                  fi

                done \
              | sort -nr \
              | head -n 1 \
              | cut -f2-
            )

          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file does not exist:"
            echo "$ZIP_FILE"
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 3. استخراج ZIP
      # --------------------------------------------------
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.zip.outputs.file }}" -d extracted

          echo "ZIP extracted successfully."
          echo ""
          echo "Project files:"
          find extracted -maxdepth 4 -type f | head -100


      # --------------------------------------------------
      # 4. پیدا کردن Android / Gradle Project
      # --------------------------------------------------
      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf "%d %p\n" \
            | sort -n \
            | head -n 1 \
            | cut -d' ' -f2-)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android/Gradle project not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 5. نصب Java
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 6. تنظیم Gradle
      # --------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6


      # --------------------------------------------------
      # 7. بررسی Gradle Wrapper
      # --------------------------------------------------
      - name: Prepare Gradle wrapper
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found."
            echo "The ZIP must contain the complete Gradle Wrapper."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper ready."


      # --------------------------------------------------
      # 8. نمایش اطلاعات Build
      # --------------------------------------------------
      - name: Show build environment
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          java -version
          ./gradlew --version


      # --------------------------------------------------
      # 9. ساخت Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          ./gradlew \
            assembleDebug \
            --stacktrace \
            --no-daemon


      # --------------------------------------------------
      # 10. پیدا کردن APK ساخته‌شده
      # --------------------------------------------------
      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find "${{ steps.project.outputs.dir }}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            ! -name "*androidTest*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Build completed but APK was not found."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          rm -rf apk-output
          mkdir -p apk-output

          cp "$APK" apk-output/SuperApp-debug.apk

          echo "apk=apk-output/SuperApp-debug.apk" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 11. آپلود APK در GitHub Actions
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SuperApp-APK
          path: apk-output/SuperApp-debug.apk
          if-no-files-found: error
          retention-days: 30
