name: Build Royesh APK From ZIP

on:
  push:
    branches: [main]
    paths: ['**/*.zip', '.github/workflows/build-apk.yml']
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Optional repository-relative ZIP path'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish Royesh APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'

      - name: Find and Safely Extract ZIP
        id: extract
        env:
          INPUT_ZIP: ${{ inputs.zip_path }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, subprocess, zipfile, stat
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          requested = os.environ.get('INPUT_ZIP', '').strip()
          candidates = []
          if requested:
              p = (root / requested).resolve()
              if not p.is_relative_to(root) or p.suffix.lower() != '.zip' or not p.is_file():
                  raise SystemExit('Invalid ZIP path')
              candidates = [p]
          else:
              before = os.environ.get('BEFORE_SHA', '')
              if os.environ['GITHUB_EVENT_NAME'] == 'push' and before and set(before) != {'0'}:
                  names = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=ACMRT', '-z', before, os.environ['GITHUB_SHA']]).decode().split('\0')
                  candidates = [root / n for n in names if n.lower().endswith('.zip') and (root / n).is_file()]
              if not candidates:
                  candidates = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() == '.zip' and '.git' not in p.parts]
          if len(candidates) != 1:
              raise SystemExit('Expected one ZIP; use workflow_dispatch zip_path to choose a file.')
          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-source'
          dest.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(candidates[0]) as archive:
              if sum(i.file_size for i in archive.infolist()) > 512 * 1024 * 1024:
                  raise SystemExit('ZIP is too large')
              for i in archive.infolist():
                  path = (dest / i.filename).resolve()
                  if not path.is_relative_to(dest.resolve()) or stat.S_ISLNK(i.external_attr >> 16):
                      raise SystemExit('Unsafe ZIP member')
              archive.extractall(dest)
          wrappers = list(dest.rglob('gradlew'))
          if len(wrappers) != 1:
              raise SystemExit('Expected exactly one Gradle project')
          project = wrappers[0].parent
          if not any((project / n).is_file() for n in ['settings.gradle', 'settings.gradle.kts']):
              raise SystemExit('Gradle settings missing')
          if not (project / 'gradle/wrapper/gradle-wrapper.jar').is_file():
              raise SystemExit('Gradle wrapper JAR missing')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'project_dir={project}\n')
          print(f'Building {candidates[0].name}')
          PY

      - name: Test Core and Build Debug APK
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :core:test :app:assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output/app-debug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: royesh-android-apk
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" output/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Royesh Android Build $GITHUB_RUN_NUMBER" \
            --notes "Royesh local-first development build. Not a production release." --latest
          echo '## Royesh APK Download' >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk" >> "$GITHUB_STEP_SUMMARY"
